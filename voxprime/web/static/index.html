<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoxPrime Chat</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --border: #3c3c3c;
      --text: #cccccc;
      --muted: #858585;
      --user: #3794ff;
      --bot: #d4d4d4;
      --accent: #4ec9b0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-size: 14px;
    }
    header span { color: var(--muted); }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .turn { max-width: 900px; }
    .msg { line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { color: var(--user); }
    .msg.bot { color: var(--bot); }
    .msg.bot .label { color: var(--muted); }
    .thinking {
      margin-top: 6px;
      font-size: 12px;
      color: #6a9955;
      white-space: pre-wrap;
    }
    .activity {
      margin-top: 8px;
      padding: 8px 10px;
      background: #2d2d30;
      border-radius: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .activity div { margin: 2px 0; }
    .activity div::before { content: "▸ "; color: var(--accent); }
    footer {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--panel);
      display: flex;
      gap: 8px;
    }
    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 160px;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
    }
    button {
      background: #0e639c;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 18px;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: 0.5; }
    .status {
      font-size: 12px;
      color: var(--muted);
      padding: 0 16px 8px;
      min-height: 1.2em;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>VoxPrime <span>— streamed like the terminal (Ollama + tools)</span></header>
  <div id="messages"></div>
  <div class="status" id="status"></div>
  <footer>
    <textarea id="input" placeholder="Ask anything… queue more while VoxPrime works" rows="2"></textarea>
    <button type="button" id="send">Send</button>
  </footer>
  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const status = document.getElementById("status");

    function addUserMsg(text) {
      const wrap = document.createElement("div");
      wrap.className = "turn";
      const div = document.createElement("div");
      div.className = "msg user";
      div.textContent = text;
      wrap.appendChild(div);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
      return wrap;
    }

    function beginBotTurn() {
      const wrap = document.createElement("div");
      wrap.className = "turn";
      const bot = document.createElement("div");
      bot.className = "msg bot";
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "VoxPrime: ";
      const body = document.createElement("span");
      body.className = "bot-body";
      bot.appendChild(label);
      bot.appendChild(body);
      wrap.appendChild(bot);

      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.hidden = true;
      wrap.appendChild(thinking);

      const activity = document.createElement("div");
      activity.className = "activity";
      activity.hidden = true;
      wrap.appendChild(activity);

      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;

      return {
        wrap,
        body,
        thinking,
        activity,
        segmentOpen: false,
      };
    }

    function scrollBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addActivityLine(activityEl, line) {
      activityEl.hidden = false;
      const row = document.createElement("div");
      row.textContent = line;
      activityEl.appendChild(row);
    }

    const pending = [];
    let draining = false;

    function updateQueueStatus() {
      const extra = pending.length;
      if (draining && extra > 0) {
        status.textContent = extra + " message(s) queued";
      } else if (!draining && extra > 0) {
        status.textContent = extra + " in queue";
      } else if (!draining) {
        status.textContent = "";
      }
    }

    function handleStreamEvent(turn, ev) {
      if (ev.type === "assistant_start") {
        if (turn.segmentOpen) {
          turn.body.appendChild(document.createTextNode("\n\n"));
        }
        const lbl = ev.label || "VoxPrime";
        turn.wrap.querySelector(".label").textContent = lbl + ": ";
        turn.segmentOpen = true;
      } else if (ev.type === "assistant_delta") {
        turn.body.appendChild(document.createTextNode(ev.text || ""));
        scrollBottom();
      } else if (ev.type === "thinking_delta") {
        turn.thinking.hidden = false;
        turn.thinking.appendChild(document.createTextNode(ev.text || ""));
        scrollBottom();
      } else if (ev.type === "status") {
        const q = pending.length ? " · " + pending.length + " queued" : "";
        status.textContent = (ev.text || "") + q;
      } else if (ev.type === "activity") {
        addActivityLine(turn.activity, ev.line || "");
        scrollBottom();
      } else if (ev.type === "error") {
        turn.body.appendChild(
          document.createTextNode("\n\nError: " + (ev.message || "unknown"))
        );
      } else if (ev.type === "turn_done") {
        const q = pending.length ? pending.length + " queued" : "";
        status.textContent = q;
        for (const ln of ev.activity || []) {
          addActivityLine(turn.activity, ln);
        }
      }
    }

    async function runOneChat(text) {
      const turn = beginBotTurn();
      let buf = "";
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || res.statusText);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.trim()) continue;
          handleStreamEvent(turn, JSON.parse(line));
        }
      }
    }

    async function drainQueue() {
      if (draining) return;
      draining = true;
      while (pending.length) {
        const text = pending.shift();
        updateQueueStatus();
        try {
          await runOneChat(text);
        } catch (e) {
          const wrap = document.createElement("div");
          wrap.className = "msg bot";
          wrap.textContent = "Error: " + e.message;
          messages.appendChild(wrap);
        }
      }
      draining = false;
      status.textContent = "";
      scrollBottom();
    }

    function enqueueMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addUserMsg(text);
      pending.push(text);
      updateQueueStatus();
      drainQueue();
    }

    send.addEventListener("click", enqueueMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        enqueueMessage();
      }
    });
  </script>
</body>
</html>
